actionPrefix: "pie"
minServerVersion: "1.0.69"   # provisioning a new category via nativeModule.category landed in 1.0.69

# All actions are implemented by the PIE_Studio C++ module, which registers
# them on the bridge via UEMCP::RegisterExternalHandler. `nativeModule.category`
# provisions a top-level `pie` tool whose actions are the handlers, unprefixed:
# pie(action="record_arm") dispatches to the bare bridge method `record_arm`.
# Params are declared so the MCP layer forwards them (anything undeclared is
# stripped before reaching the bridge); they are all optional at the schema
# level - the C++ handler validates requiredness and returns a clear error, so
# "(required)" in a description is the contract.

nativeModule:
  uePluginName: PIE_Studio
  minBridgeApi: 1
  source: ue/Plugins/PIE_Studio
  category: pie
  categoryDescription: "PIE test automation: record, replay, observe, diff, snapshot, and inject input during Play-In-Editor sessions"
  handlers:

    # ── Input injection ───────────────────────────────────────────
    inject_input:
      description: "Single-frame Enhanced Input inject"
      schema:
        action_path: { type: string,  description: "InputAction asset path (required)" }
        value_x:     { type: number,  description: "Axis/bool value X (default 1)" }
        value_y:     { type: number }
        value_z:     { type: number }
        client_id:   { type: number,  description: "PIE client index (default 0)" }
    inject_input_start:
      description: "Begin holding an Enhanced Input action"
      schema:
        action_path:  { type: string, description: "InputAction asset path (required)" }
        value_x:      { type: number }
        value_y:      { type: number }
        value_z:      { type: number }
        injection_id: { type: string, description: "Caller-chosen hold id (optional; minted if absent)" }
        client_id:    { type: number }
    inject_input_update:
      description: "Change value of a running hold"
      schema:
        injection_id: { type: string, description: "Hold id from inject_input_start (required)" }
        value_x:      { type: number }
        value_y:      { type: number }
        value_z:      { type: number }
    inject_input_stop:
      description: "Stop a running hold or tape by id"
      schema:
        injection_id: { type: string, description: "Injection id to stop (required)" }
    inject_input_tape:
      description: "Play a per-frame value array through Enhanced Input"
      schema:
        action_path:  { type: string, description: "InputAction asset path (required)" }
        values:       { type: array,  description: "Per-frame values - numbers or [x,y,z] arrays (required)" }
        hz:           { type: number, description: "Playback rate (default 60)" }
        injection_id: { type: string }
        client_id:    { type: number }

    # ── Recording ─────────────────────────────────────────────────
    record_arm:
      description: "Arm the PIE input recorder"
      schema:
        actions:            { type: array,   description: "InputAction paths to record (default: auto-discover)" }
        track_values:       { type: array,   description: "Dotted value paths to sample each frame" }
        track_actors:       { type: array,   description: "Actor ids to sample pos/rot/vel each frame" }
        axis_threshold:     { type: number,  description: "Axis change deadzone (default 0.15)" }
        sample_hz:          { type: number,  description: "Sample rate (default 60)" }
        pin_fps:            { type: number,  description: "Pin PIE fps for determinism (default sample_hz)" }
        capture_pawn_state: { type: boolean }
        capture_montage:    { type: boolean }
        take_record:        { type: boolean, description: "Also drive Take Recorder" }
        client_id:          { type: number }
        rng_seed:           { type: number,  description: "Seed the stream RNG for reproducible runs" }
        run_gap_frames:     { type: number,  description: "Frames of inactivity that split runs (default 6)" }
        recording_dir:      { type: string,  description: "Recordings root (default: project Saved)" }
        id:                 { type: string,  description: "Recording id (default: timestamp)" }
    record_disarm:
      description: "Cancel an armed recording"
    record_stop:
      description: "Finalize in-flight recording"
    record_status:
      description: "Recorder state poll"
    record_list:
      description: "List recordings"
      schema:
        recording_dir: { type: string }
        limit:         { type: number, description: "Max rows (default 200)" }
        offset:        { type: number }
    record_read:
      description: "Read a recording artifact"
      schema:
        id:            { type: string, description: "Recording id (required)" }
        file:          { type: string, description: "manifest | sequence | csv | drift | tracked (default manifest)" }
        recording_dir: { type: string }
        limit:         { type: number, description: "csv only: max rows (default 1000)" }
        offset:        { type: number, description: "csv only: starting row" }
    record_delete:
      description: "Delete a recording directory"
      schema:
        id:            { type: string,  description: "Recording id (required)" }
        confirm:       { type: boolean, description: "Must be true to actually delete" }
        recording_dir: { type: string }
    mark:
      description: "Insert a marker into the recording timeline"
      schema:
        label: { type: string, description: "Marker label (required)" }

    # ── Replay ────────────────────────────────────────────────────
    replay_arm:
      description: "Arm the PIE input replayer"
      schema:
        recording_id:        { type: string,  description: "Source recording id" }
        sequence_path:       { type: string,  description: "Explicit sequence.json path" }
        recording_dir:       { type: string }
        steps:               { type: array,   description: "Inline step array (alternative to a recording)" }
        settle_ms:           { type: number,  description: "Settle delay before playback (default 500)" }
        sample_hz:           { type: number }
        rng_seed:            { type: number }
        pin_fps:             { type: number }
        apply_rng_seed:      { type: boolean, description: "Re-apply recorded seed (default true)" }
        record_drift:        { type: boolean, description: "Record drift vs source (default true)" }
        auto_stop_pie:       { type: boolean }
        eject:               { type: boolean, description: "Eject to spectator during replay" }
        time_scale:          { type: number,  description: "Playback speed multiplier (default 1)" }
        mode:                { type: string,  description: "replay | monitor (default replay)" }
        capture_frame_every: { type: number,  description: "Capture a viewport frame every N steps" }
        encode_gif:          { type: boolean, description: "Also encode an animated GIF from captured frames (default false; frames + contact sheet are the useful artifacts)" }
        fixed_timestep:      { type: boolean, description: "Drive the engine at a fixed 1/pin_fps delta during replay for stronger reproducibility (default false; not full determinism)" }
        client_id:           { type: number }
        drift_thresholds:    { type: object,  description: "position_cm / rotation_deg / velocity_cms / tracked overrides" }
    replay_run:
      description: "Unattended replay: arm + start PIE in one call (no human Play), auto-stops PIE and writes drift.json when done. Poll replay_status until pie_active=false, then read drift. Accepts the same params as replay_arm."
      schema:
        recording_id:        { type: string,  description: "Source recording id" }
        recording_dir:       { type: string,  description: "Recording folder (used as the source when no recording_id/sequence_path is given)" }
        sequence_path:       { type: string,  description: "Explicit sequence.json path" }
        steps:               { type: array,   description: "Inline step array (alternative to a recording)" }
        settle_ms:           { type: number,  description: "Settle delay before playback (default 500)" }
        sample_hz:           { type: number }
        rng_seed:            { type: number }
        pin_fps:             { type: number }
        apply_rng_seed:      { type: boolean, description: "Re-apply recorded seed (default true)" }
        record_drift:        { type: boolean, description: "Record drift vs source (default true)" }
        auto_stop_pie:       { type: boolean, description: "End PIE when the run completes (default true for replay_run)" }
        eject:               { type: boolean, description: "Eject to spectator during replay" }
        time_scale:          { type: number,  description: "Playback speed multiplier (default 1)" }
        mode:                { type: string,  description: "replay | monitor (default replay)" }
        capture_frame_every: { type: number,  description: "Capture a viewport frame every N steps (keeps JPEG frames + builds a contact sheet)" }
        encode_gif:          { type: boolean, description: "Also encode an animated GIF on finish (default false)" }
        fixed_timestep:      { type: boolean, description: "Fixed 1/pin_fps timestep during replay for stronger reproducibility (default false)" }
        client_id:           { type: number }
        drift_thresholds:    { type: object,  description: "position_cm / rotation_deg / velocity_cms / tracked overrides" }
    replay_analyze:
      description: "Read a finalised drift.json and return the synthesised lead: first divergence (frame, channel, source vs replay value), top channels, errors logged during the run, and the images bracketing the divergence. Read this instead of the drift CSV."
      schema:
        recording_id:  { type: string, description: "Source recording id" }
        recording_dir: { type: string, description: "Recording folder (used directly when no id is given)" }
    replay_state:
      description: "Deterministic state replay: return the exact recorded pawn transform at a time/frame (scrub/snapshot), interpolated. Zero drift (nothing is simulated). Optionally apply the recorded pose to the live PIE pawn."
      schema:
        recording_id:  { type: string,  description: "Source recording id" }
        recording_dir: { type: string,  description: "Recording folder (used directly when no id is given)" }
        at_time:       { type: number,  description: "Seconds to sample (interpolated). Omit for the last frame" }
        at_frame:      { type: number,  description: "Frame index to sample (alternative to at_time)" }
        apply:         { type: boolean, description: "Teleport the live PIE pawn to the recorded pose (default false)" }
    replay_disarm:
      description: "Cancel an armed replay"
    replay_stop:
      description: "Stop in-flight replay"
    replay_status:
      description: "Replayer state poll"

    # ── Reproduction tests ────────────────────────────────────────
    test_scaffold:
      description: "Turn a recording into a durable, self-verifying test.json: max-drift/error assertions plus an auto-derived predicates block (range invariants per channel, montage-plays events, no-errors). Edit predicates into intent, then run with test_run."
      schema:
        recording_id:           { type: string, description: "Source recording id" }
        recording_dir:          { type: string, description: "Recording folder (used directly when no id is given)" }
        name:                   { type: string, description: "Test name (default repro)" }
        max_position_drift_cm:  { type: number, description: "Assertion: max allowed position drift (default 10)" }
        max_velocity_drift_cms: { type: number, description: "Assertion: max allowed velocity drift (default 50)" }
        max_rotation_drift_deg: { type: number, description: "Assertion: max allowed rotation drift (default 5)" }
        max_errors:             { type: number, description: "Assertion: max errors logged during the run (default 0)" }
    test_run:
      description: "Run a scaffolded reproduction test: replays the recording (auto_run) then checks the finalised drift.json + error count against the assertions AND evaluates the scenario's predicates over the recorded series. Returns passed + failures + a predicates verdict + artifacts."
      schema:
        test_path:     { type: string,  description: "Explicit test.json path" }
        recording_id:  { type: string,  description: "Recording id (with name) to locate the test" }
        recording_dir: { type: string,  description: "Recording folder to locate the test" }
        name:          { type: string,  description: "Test name (default repro)" }
        auto_run:      { type: boolean, description: "Drive the replay if no drift.json exists yet (default true)" }
    assert_eval:
      description: "Assertion layer: evaluate predicates over a finalised run's per-frame series (observation.csv/recording.csv) + session_errors.json + markers. Each assertion binds a channel or event to an operator under a temporal quantifier (hold). Returns a verdict with, per assertion, passed + a witness frame/time/value + contact sheet. Writes verdict.json. Predicate schema: {name, channel|event, op(eq|ne|lt|lte|gt|gte|approx|between|changed|increased|decreased|crossed), value|min+max|tol, hold(always|never|eventually|at_end|once_then_always), from_s/from_frame/to_s/to_frame, within_s/within_frames, after_event{marker}, severity(error|warn)}. Channels: series columns (pos_z, speed2d, game_ms), tracked values by path (Boss.Health -> t:Boss.Health), pseudo-channels $errors/$warnings/$frame/$time. Events: montage{montage,phase}, marker{marker}, error{category,contains}."
      schema:
        run_id:        { type: string, description: "Observation run id (resolves observation.csv under output_dir)" }
        output_dir:    { type: string, description: "Observation root (default Saved/MCPObservations)" }
        recording_dir: { type: string, description: "Recording/replay folder (resolves recording.csv)" }
        recording_id:  { type: string, description: "Recording id under Saved/MCPRecordings" }
        csv_path:      { type: string, description: "Explicit per-frame series CSV (overrides run resolution)" }
        assertions:    { type: array,  description: "Predicate objects to evaluate (see description). Omit to use test_path's predicates." }
        test_path:     { type: string, description: "Scenario json to read the predicates block from, when assertions is omitted" }
    test_list:
      description: "List scaffolded reproduction tests (all recordings, or one when recording_id/dir is given)."
      schema:
        recording_id:  { type: string }
        recording_dir: { type: string }

    # ── Offline diff ──────────────────────────────────────────────
    record_diff:
      description: "Diff two recordings"
      schema:
        a_id:               { type: string, description: "First recording id (required)" }
        b_id:               { type: string, description: "Second recording id (required)" }
        recording_dir:      { type: string }
        position_cm:        { type: number, description: "Position drift threshold (default 5)" }
        rotation_deg:       { type: number, description: "Rotation drift threshold (default 2)" }
        velocity_cms:       { type: number, description: "Velocity drift threshold (default 25)" }
        tracked_default:    { type: number, description: "Default tracked-value threshold" }
        tracked_thresholds: { type: object, description: "Per-path tracked-value thresholds" }

    # ── Snapshot ──────────────────────────────────────────────────
    snapshot:
      description: "Snapshot a PIE actor's full UProperty state to JSON"
      schema:
        target:             { type: string,  description: "Actor id to snapshot (required)" }
        include_components: { type: boolean, description: "Dump components too (default true)" }
        recording_id:       { type: string,  description: "Store under this recording's snapshots/ dir" }
        recording_dir:      { type: string }
        name:               { type: string,  description: "Snapshot filename (default: timestamp)" }

    # ── Per-tick actor telemetry (#954) ───────────────────────────
    telemetry_start:
      description: "Record an actor's state every tick for a bounded window and return it as a time series. Use when one point-in-time read cannot answer the question: did the jump leave the ground, how high did it rise, how long was it airborne, did the impulse settle, did the blend finish. Returns immediately with an id - a bridge handler runs on the game thread, so blocking here would stop the ticks being sampled. Poll telemetry_status until state=completed. Bounded by duration_seconds AND max_samples (whichever comes first), and torn down on completion, stop, EndPIE or a stalled world, so no sampler can outlive the call."
      schema:
        actorLabel:              { type: string,  description: "Subject actor: editor label, object name, class name, or path. Required unless every channel names its own target." }
        component:               { type: string,  description: "Narrow the subject to a named component subobject, by name or class" }
        subsystem:               { type: string,  description: "Subject is a running subsystem instead of an actor (class short name or path)" }
        scope:                   { type: string,  description: "Subsystem scope: game | world | localplayer | engine (default: search all)" }
        objectPath:              { type: string,  description: "Subject is the object at this path" }
        viaProperty:             { type: string,  description: "Follow a dotted UPROPERTY path from the subject to the object it points at, e.g. an actor pointer set at run time" }
        fields:                  { type: array,   description: "Built-in channels: location | rotation | velocity | speed | grounded | falling | distance_to_ground (default: location, velocity, grounded)" }
        properties:              { type: array,   description: "Dotted property paths sampled each tick. Strings, or {name, path, actor?/subsystem?/component?} to rename or point at another object. Struct leaves come back as objects." }
        getters:                 { type: array,   description: "No-argument UFUNCTIONs invoked each tick, return value recorded. Strings, or {name, func, actor?/subsystem?/component?}. A function that takes arguments is rejected at start." }
        duration_seconds:        { type: number,  description: "Stop after this much world time (default 2, hard cap 60)" }
        max_samples:             { type: number,  description: "Stop after this many samples (default 600, hard cap 20000)" }
        sample_every_tick:       { type: boolean, description: "Sample on every rendered frame (default true)" }
        sample_interval_seconds: { type: number,  description: "Sample at most this often instead of every tick" }
        every_n_ticks:           { type: number,  description: "Sample one tick in N (default 1)" }
        call_on_start:           { type: object,  description: "{func, args?, actor?/component?/subsystem?} invoked once, right after the baseline sample. Kicks off the thing under test without a second round trip." }
        id:                      { type: string,  description: "Caller-chosen recording id (default: minted)" }
    telemetry_status:
      description: "Poll a telemetry recording. Returns state, sample count, elapsed time, and the stop reason once finished. A finished run returns its samples and per-channel summary by default: numeric channels carry first/last/min/max with the time of each extreme, vector channels are summarised per component, and boolean channels carry their transitions plus seconds spent true and false - which is what a rise height and an air time are read off."
      schema:
        id:              { type: string,  description: "Recording id (default: the most recent)" }
        include_samples: { type: boolean, description: "Include the raw per-tick rows (default: true once completed, false while recording)" }
    telemetry_stop:
      description: "Stop a telemetry recording early and return its series and summary. Omit id to stop every live recording."
      schema:
        id:              { type: string,  description: "Recording id (default: all live recordings)" }
        include_samples: { type: boolean, description: "Include the raw per-tick rows (default true)" }

    # ── Actor puppeteering (Arrange: write the live world) ─────────
    actor_spawn:
      description: "Spawn an actor in the live PIE world so an agent can Arrange a scenario. Returns a stable id (usable as target for actor_set/call/destroy and snapshot)."
      schema:
        class:    { type: string, description: "Class path: native class or blueprint '/Game/.../BP_X.BP_X_C' (required)" }
        at:       { type: array,  description: "World location [x,y,z] (default origin)" }
        rotation: { type: array,  description: "Rotation [pitch,yaw,roll] (default 0)" }
        scale:    { type: array,  description: "Scale [x,y,z] (default 1)" }
    actor_destroy:
      description: "Destroy a live PIE actor by id."
      schema:
        target: { type: string, description: "Actor id (required)" }
    actor_set:
      description: "Set a UProperty on a live PIE actor by dotted path (Component.Struct.Property), coerced through ImportText. This is the write half of snapshot's reflection read."
      schema:
        target: { type: string, description: "Actor id (required)" }
        path:   { type: string, description: "Dotted property path, e.g. Health or Movement.MaxWalkSpeed (required)" }
        value:  { type: string, description: "Value to write, as text: \"100\", \"true\", \"EMyEnum::Foo\", \"(X=1,Y=2)\" (required)" }
    actor_call:
      description: "Invoke a callable UFUNCTION on a live PIE actor, importing args positionally into its parameters."
      schema:
        target: { type: string, description: "Actor id (required)" }
        func:   { type: string, description: "Function name (required)" }
        args:   { type: array,  description: "Positional arguments, coerced into the function's parameters" }

    # ── Orchestration: one uninterruptible dispatch (#955, #960) ───
    run_sequence:
      description: >-
        Run an ordered list of steps against the live PIE world inside ONE game-thread dispatch, so
        nothing else can land between them. Use when a verification only means anything as a whole:
        create subsystem state, bind it to a runtime-spawned actor's component, kick off a flow, step
        it until a flag clears, then read values off two objects. Steps: spawn {class, at?, rotation?,
        scale?, capture?} | set {target, path, value} | call {target, func, args?, capture?} |
        read {target, property, capture?} | loop {while|until, max_iterations (REQUIRED), steps}.
        Every step addresses its object the same way: a bare "target" string is an actor token, or
        "target"/the step itself carries {actor|actorLabel|subsystem|objectPath|ref, component?,
        viaProperty?} - which is how a named component subobject on a spawned actor, and an object a
        UPROPERTY pointer was made to point at during the run, get named at all. viaProperty is
        spelled apart from a step's own "property" because a read step and a loop condition each
        carry one meaning the value to read. "capture" names a
        step's result so a later step can use it as {"target": {"ref": "<name>"}}, and every capture
        comes back in the returned captured map. The loop's max_iterations is mandatory and capped,
        because a predicate that never clears would hang the dispatch. Validated in full before the
        first step touches the world. No step waits for a tick - the world does not advance inside a
        run, so use telemetry_start for anything that needs elapsed time.
      schema:
        steps:         { type: array,   description: "Ordered step objects (required, max 64)" }
        on_error:      { type: string,  description: "abort (default) | continue" }
        validate_only: { type: boolean, description: "Check the step list and return without running it" }
    sample_loop:
      description: >-
        Invoke a function N times and snapshot a set of properties between every turn, all inside ONE
        game-thread dispatch. Built for the case invoke_object_function cannot cover: looping an
        ability activation while reading struct fields off two live gameplay records per turn.
        Struct-valued properties come back as JSON objects, not stringified blobs, and each
        invocation's own return value is recorded next to the snapshot because that answer is often
        the verdict. Iterations are capped. Returns an optional baseline snapshot plus one entry per
        turn. Nothing ticks between the call and the read, so turn N's snapshot is the state that
        call produced.
      schema:
        iterations:    { type: number,  description: "How many turns to run (required, 1..1000)" }
        invoke:        { type: object,  description: "Invoked each turn: {actor|subsystem|objectPath|ref, component?, func, args?}" }
        invokes:       { type: array,   description: "Several invocations per turn, in order (alternative to invoke)" }
        sample:        { type: array,   description: "Snapshotted after each turn: [{actor|subsystem|objectPath|ref, component?, property, name?}] (required)" }
        stop_when:     { type: object,  description: "Stop before the next turn when this holds: {target..., property, op?, value?, tolerance?}. Ops: eq|ne|lt|lte|gt|gte|is_true|is_false" }
        sample_before: { type: boolean, description: "Take a baseline snapshot before the first turn (default true)" }
        on_error:      { type: string,  description: "abort (default) | continue" }

    # ── Declarative scenario (the committed Arrange/Act/Assert unit) ─
    scenario_scaffold:
      description: "Generate a declarative scenario.json (arrange/act/assert) from a recording: empty arrange, a replay act step, and starter assert predicates derived from the series. Edit into intent, then scenario_validate. The reusable, git-committable test unit."
      schema:
        recording_id:  { type: string, description: "Source recording id" }
        recording_dir: { type: string, description: "Recording/observation folder (used directly when no id is given)" }
        name:          { type: string, description: "Scenario name (default scenario)" }
        max_errors:    { type: number, description: "no-errors predicate threshold (default 0)" }
    scenario_validate:
      description: "Validate a scenario's structure and predicates without running it: known arrange/act step kinds, required per-kind fields, and every assert entry parsing as a valid predicate. Returns valid + per-problem errors + step counts. Act supports replay | inject_tape | drive | goto | face | follow | call; a 'call' act step is a TIMED gameplay UFUNCTION ({at_seconds, target, component?, func, args?}) and is checked for target/func like arrange's, because a mistyped timed step otherwise fails by silently never firing."
      schema:
        scenario_path: { type: string, description: "Path to a scenario.json" }
        scenario:      { type: object, description: "Inline scenario object (alternative to scenario_path)" }

    # ── Observation profiles ──────────────────────────────────────
    profile_create:
      description: "Create an observation profile asset"
      schema:
        name:                            { type: string,  description: "Asset name (required)" }
        package_path:                    { type: string,  description: "Content path (default /Game/Observation)" }
        onConflict:                      { type: string,  description: "skip | replace (default skip)" }
        tracked_values:                  { type: array,   description: "Value paths or {path, drift_threshold} objects" }
        tracked_actors:                  { type: array,   description: "Actor ids to track" }
        capture_pawn_state:              { type: boolean }
        capture_montage:                 { type: boolean }
        position_threshold_cm:           { type: number }
        rotation_threshold_deg:          { type: number }
        velocity_threshold_cms:          { type: number }
        tracked_value_default_threshold: { type: number }
    profile_read:
      description: "Read an observation profile"
      schema:
        path: { type: string, description: "Profile asset path (required)" }
    profile_update:
      description: "Update an observation profile"
      schema:
        path:                            { type: string, description: "Profile asset path (required)" }
        tracked_values:                  { type: array,  description: "Replaces the tracked-values list" }
        tracked_actors:                  { type: array,  description: "Replaces the tracked-actors list" }
        capture_pawn_state:              { type: boolean }
        capture_montage:                 { type: boolean }
        position_threshold_cm:           { type: number }
        rotation_threshold_deg:          { type: number }
        velocity_threshold_cms:          { type: number }
        tracked_value_default_threshold: { type: number }
    profile_delete:
      description: "Delete an observation profile"
      schema:
        path:    { type: string,  description: "Profile asset path (required)" }
        confirm: { type: boolean, description: "Must be true to actually delete" }
    profile_list:
      description: "List observation profiles"
      schema:
        directory: { type: string, description: "Content path prefix to filter (default /Game)" }

    # ── Observation runs ──────────────────────────────────────────
    observe_arm:
      description: "Arm the PIE observer"
      schema:
        profile:    { type: string, description: "Observation profile asset path (required)" }
        output_dir: { type: string }
        sample_hz:  { type: number, description: "Sample rate (default 60)" }
        client_id:  { type: number }
        pin_fps:    { type: number }
    observe_disarm:
      description: "Cancel an armed observation"
    observe_stop:
      description: "Stop in-flight observation"
    observe_status:
      description: "Observer state poll"
    observe_list:
      description: "List observation runs"
      schema:
        output_dir: { type: string }
        limit:      { type: number, description: "Max rows (default 200)" }
    observe_read:
      description: "Read an observation run artifact. file=series returns per-channel time series (min/max/first/last, first_frame_over a threshold) instead of raw rows."
      schema:
        run_id:         { type: string,  description: "Observation run id (required)" }
        output_dir:     { type: string }
        file:           { type: string,  description: "manifest | csv | tracked | series (default manifest)" }
        limit:          { type: number,  description: "csv/tracked: max rows (default 1000)" }
        offset:         { type: number }
        channels:       { type: string,  description: "series: comma-separated column names (default: all t:* + speed2d + gpu_ms/game_ms)" }
        threshold:      { type: number,  description: "series: report the first frame where |value| exceeds this" }
        include_values: { type: boolean, description: "series: include the (downsampled) value array (default false)" }
        max_points:     { type: number,  description: "series: cap on values returned per channel (default 500)" }

    # ── Live PIE introspection ────────────────────────────────────
    anim_state:
      description: "Get PIE anim instance state (montage + state machines)"
      schema:
        actorLabel: { type: string, description: "Actor label/name in PIE (required)" }
    anim_properties:
      description: "Read UPROPERTY values on a PIE actor's AnimInstance"
      schema:
        actorLabel:    { type: string, description: "Actor label/name in PIE (required)" }
        propertyNames: { type: array,  description: "Specific property names (default: all)" }
    subsystem_state:
      description: "Read UPROPERTY values on a running subsystem in PIE"
      schema:
        subsystemClass: { type: string, description: "Subsystem class short name or path (required)" }
        scope:          { type: string, description: "game | engine | world | localplayer (default game)" }
        propertyNames:  { type: array,  description: "Specific property names (default: all)" }

    # ── Session log / errors ──────────────────────────────────────
    session_errors:
      description: "Deduped errors + warnings captured from the Output Log during a PIE session. Call this first after a run to see what errored. Reads the live/most-recent session in memory, or a finished one from disk."
      schema:
        session:       { type: string, description: "Session id under Saved/MCPSessions (default: live/most-recent in memory)" }
        session_dir:   { type: string, description: "Absolute session dir (overrides session)" }
        min_verbosity: { type: string, description: "error | warning (default warning)" }
    session_log:
      description: "Paged raw Output Log lines captured during a PIE session, with filters."
      schema:
        session:       { type: string, description: "Session id under Saved/MCPSessions (default: live/most-recent in memory)" }
        session_dir:   { type: string, description: "Absolute session dir (overrides session)" }
        min_verbosity: { type: string, description: "error | warning | display | log | verbose (default log)" }
        category:      { type: string, description: "Exact log category filter (e.g. LogTemp)" }
        contains:      { type: string, description: "Substring the message must contain" }
        limit:         { type: number, description: "Max rows (default 200)" }
        offset:        { type: number, description: "Starting row" }

    # ── Profiling ─────────────────────────────────────────────────
    perf_summary:
      description: "Aggregate a recording's per-frame perf into a lead: frametime avg/p50/p99/max, avg game/render/gpu ms, peak memory, and the worst hitches with timestamps."
      schema:
        recording_id:  { type: string, description: "Recording id" }
        recording_dir: { type: string, description: "Recording folder (used directly when no id is given)" }
    trace_start:
      description: "Start an Unreal Insights trace to a .utrace file. Returns the path to open in Unreal Insights. Call trace_stop to finish."
      schema:
        channels:   { type: string, description: "Comma-separated trace channels (default cpu,frame,bookmark,stats,counters,gpu)" }
        output_dir: { type: string, description: "Destination dir (default Saved/MCPTraces)" }
        name:       { type: string, description: "Trace filename (default pie_<timestamp>.utrace)" }
    trace_stop:
      description: "Stop the active Unreal Insights trace and report the .utrace path."

    # ── Standalone viewport capture ───────────────────────────────
    capture:
      description: "Grab N viewport frames from the live PIE session now (decoupled from replay). Writes JPEGs plus a labeled contact sheet and returns their paths. Use to make observe/inject flows visual."
      schema:
        frames:        { type: number, description: "How many frames to grab (default 1)" }
        every:         { type: number, description: "Grab one frame every N rendered frames (default 1)" }
        output_dir:    { type: string, description: "Destination dir (default Saved/MCPCaptures/<timestamp>)" }
        format:        { type: string, description: "jpg | png (default jpg)" }
        quality:       { type: number, description: "JPEG quality 1-100 (default 80)" }
        contact_sheet: { type: boolean, description: "Also compose a labeled grid montage (default true)" }

inject: {}
tasks: {}
flows: {}
